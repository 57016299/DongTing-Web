<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="动听音乐域名迁移通知，正在跳转至新官网" />
    <title>动听音乐｜域名已迁移</title>
    <!-- 复用你原网站的样式，务必把 styles.css 上传到旧域名服务器 -->
    <link rel="stylesheet" href="./styles.css?v=20260519" />
    <style>
        /* 本页面专属布局，不改动原有css类 */
        .migrate-wrap {
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .migrate-card {
            max-width: 620px;
            width: 100%;
            text-align: center;
        }
        .migrate-old {
            color: #ff7b7b;
            word-break: break-all;
        }
        .migrate-new {
            color: #73d084;
            word-break: break-all;
        }
        .migrate-countdown {
            margin: 28px 0;
            opacity: 0.75;
        }
    </style>
</head>
<body>
<div class="site-shell">
    <header class="topbar">
        <a class="brand" href="#" aria-label="动听音乐">
            <!-- logo资源依赖旧服务器assets目录，没有的话图片会丢失，可以删掉img只保留文字 -->
            <img src="./assets/brand/logo.png" alt="动听音乐" />
            <span>动听音乐</span>
        </a>
    </header>

    <main class="migrate-wrap">
        <div class="migrate-card">
            <p class="eyebrow">Site Migration</p>
            <h1>网站域名即将停用</h1>

            <div style="margin-top:24px;line-height:1.8;">
                <p>旧域名：<span class="migrate-old">www.dongting.zh.kg</span></p>
                <p style="margin-top:12px;">新官网：<a class="migrate-new" href="https://dongting.57016299.xyz">dongting.57016299.xyz</a></p>
                <p style="margin-top:16px;">
                    服务器已从海外更换至国内，访问速度更快，加载更流畅，不再卡顿。
                </p>
            </div>

            <div class="migrate-countdown">
                将在 <span id="count">5</span> 秒后自动跳转至新官网
            </div>

            <div style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
                <a class="button primary" href="https://dongting.57016299.xyz">立即前往新官网</a>
                <a class="button ghost" href="https://dongting.57016299.xyz">复制新域名手动访问</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>© 动听音乐 Official Site</p>
    </footer>
</div>

<script>
    let sec = 5;
    const countDom = document.getElementById('count');
    const target = "https://dongting.57016299.xyz";
    const timer = setInterval(()=>{
        sec -= 1;
        countDom.innerText = sec;
        if(sec <= 0){
            clearInterval(timer);
            window.location.href = target;
        }
    },1000);
</script>
</body>
</html>
